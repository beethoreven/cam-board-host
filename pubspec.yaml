name: cam_board_host
description: "cam-board 鄉民端"
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # 兩端共用的邏輯。用相對路徑，所以要從 cam-board 這個 meta repo 裡建置。
  cam_board_core:
    path: ../cam-board-core
  bonsoir: ^7.1.6
  flutter_webrtc: ^1.6.3
  # 固定在 0.6.0：0.7 以上要求 Flutter 3.50，跟鎖定的 3.47.9 不相容（見根目錄 README）。
  window_manager: 0.6.0
  # window_manager 0.6.0 的底層。直接引用是為了取得螢幕的可用範圍；
  # 版本要跟 window_manager 0.6.0 依賴的一致，升 window_manager 時一起升。
  nativeapi: 0.5.10
  file_selector: ^1.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 在真的 macOS 程式裡跑、用真的區域網路搜尋的測試。
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
